# =============================================================================
# Test profile — used by Testcontainers-backed integration tests
# =============================================================================
# Datasource URL, username, and password are injected by @ServiceConnection.
# Auth secrets are test-only fixed values; production reads the same names from
# the environment.
# =============================================================================

ALLOWED_EMAIL_DOMAIN: college.edu
JWT_SECRET: test-jwt-secret-0123456789abcdef0123456789abcdef
MAIL_FROM: no-reply@college.edu
APP_BASE_URL: http://localhost:8081

spring:
  mail:
    host: localhost
    port: 1025

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true

server:
  port: 0

# Keep the scheduled stale-job sweep out of the test path. Reaper tests call
# reapStaleJobs(Instant) directly and therefore do not depend on wall time.
formation:
  jobs:
    stale-timeout: PT5M
    reaper-interval: PT24H
    reaper-initial-delay: PT24H
    global-concurrency: 4
    per-mentor-concurrency: 2
    execution-budget: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

