# =============================================================================
# Student Team Formation — Spring Boot Configuration
# =============================================================================
# All database credentials are sourced from environment variables.
# Never hardcode passwords in this file.
# =============================================================================

spring:
  application:
    name: student-team-formation

  # ---------------------------------------------------------------------------
  # DataSource — MySQL
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_team_formation}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: StudentTeamFormationPool

  # ---------------------------------------------------------------------------
  # JSON — reject unknown request fields such as phone or role
  # ---------------------------------------------------------------------------
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # ---------------------------------------------------------------------------
  # Mail — SMTP coordinates come from the environment
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # ---------------------------------------------------------------------------
  # Flyway
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    validate-on-migrate: true

# =============================================================================
# Engine 3 — bounded formation search
# =============================================================================
formation:
  search:
    # A node is one attempt to place one ordered student into one candidate
    # team after capacity and symmetry filtering.
    max-nodes: 250000
    # Reaching this many accepted swaps with a valid plan is a successful run.
    max-improvement-passes: 100
  jobs:
    # A committed READY or RUNNING job older than this is considered abandoned
    # and is failed by the recovery reaper with STALE_JOB / RECOVERY.
    stale-timeout: PT15M
    # Scheduled sweep cadence. The sweep locks and rechecks one job at a time.
    reaper-interval: PT1M
    reaper-initial-delay: PT2M
    # Bounded in-process admission control for synchronous runs. A request that
    # cannot take both permits is rejected immediately with 429 and is not
    # queued. The database project lock remains the cross-instance guarantee.
    global-concurrency: 4
    per-mentor-concurrency: 2
    # Optional wall-clock budget for one in-process search.
    execution-budget: PT30S

# =============================================================================
# Server
# =============================================================================
server:
  port: 8081

# =============================================================================
# Actuator
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    # Mail must never make the application look unhealthy. Resend is available
    # when SMTP is temporarily unreachable.
    mail:
      enabled: false
